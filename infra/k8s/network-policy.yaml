apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amber-vpc-isolation-policy
  namespace: amber-sre
spec:
  podSelector:
    matchLabels:
      app: amber-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controllers and internal monitoring webhooks
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to PostgreSQL and Redis
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Allow outbound HTTPS to Gemini API and Slack/Telegram webhook APIs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 443
