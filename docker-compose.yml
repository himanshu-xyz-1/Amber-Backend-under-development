version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amber}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-amber_secure_password}"
      POSTGRES_DB: ${POSTGRES_DB:-amber_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amber} -d ${POSTGRES_DB:-amber_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amber-network

  redis:
    image: redis:7-alpine
    container_name: amber-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - amber-network


  # ──────────────────────────────────────────────────────────────────────
  # Ollama — Universal Local LLM Engine (The Lego Brain Socket)
  #
  # SECURITY: No host port exposed. Ollama is only accessible inside
  # the Docker bridge network via http://ollama:11434.
  # The backend connects to it; nothing external can reach it.
  #
  # MODEL: Set LOCAL_LLM_MODEL in .env to any model you've pulled.
  # Examples: qwen2.5-coder:14b, llama3.3:70b, deepseek-r1:70b, qwen4:latest
  #
  # GPU: Uncomment the 'deploy' block below for NVIDIA GPU passthrough.
  # ──────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: amber-ollama
    restart: unless-stopped
    # NO host port binding — internal Docker network only (security)
    # To access from host for debugging: docker exec -it amber-ollama ollama list
    volumes:
      - ollama_models:/root/.ollama  # Persistent: models survive container restarts
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=16384
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - amber-network
    # ── NVIDIA GPU passthrough (uncomment if you have an NVIDIA GPU) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    image: amber-backend:latest
    container_name: amber-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-amber}:${POSTGRES_PASSWORD:-amber_secure_password}@postgres:5432/${POSTGRES_DB:-amber_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - LOCAL_LLM_ENDPOINT=http://ollama:11434/v1
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - amber-network

  telegram-bot:
    image: amber-backend:latest
    container_name: amber-telegram-bot
    restart: unless-stopped
    command: ["python", "-m", "backend.app.integrations.telegram_bot"]
    env_file:
      - .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-amber}:${POSTGRES_PASSWORD:-amber_secure_password}@postgres:5432/${POSTGRES_DB:-amber_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - ENVIRONMENT=production
    networks:
      - amber-network

volumes:
  postgres_data:
  redis_data:
  ollama_models:    # Persistent model storage — models survive container restarts

networks:
  amber-network:
    driver: bridge

