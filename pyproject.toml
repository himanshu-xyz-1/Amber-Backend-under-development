[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amber-backend"
version = "0.1.0"
description = "Amber Autonomous Incident Remediation & SRE Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSL-1.1" }
authors = [
    { name = "Amber Technologies Inc.", email = "team@ambersre.xyz" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.4",
    "pgvector>=0.2.5",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.8",
    "langchain-community>=0.2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.4",
    "langfuse>=2.36.0",
    "stripe>=9.8.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "google-genai>=2.25.0",
    "kubernetes>=31.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://ambersre.xyz"
Documentation = "https://ambersre.xyz/docs"
Repository = "https://github.com/himanshu-xyz-1/Amber-Backend"
Issues = "https://github.com/himanshu-xyz-1/Amber-Backend/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
